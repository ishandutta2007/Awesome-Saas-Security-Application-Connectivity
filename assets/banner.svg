<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="350" fill="url(#bgGradient)"/>
  <rect width="1200" height="350" fill="url(#grid)"/>

  <!-- Dynamic / Animated Ambient Elements (Background Glowing Orbs) -->
  <circle cx="150" cy="80" r="180" fill="url(#glowGradient)">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="180;210;180" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1050" cy="270" r="220" fill="url(#glowGradient)">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="r" values="220;190;220" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Network / Connectivity Flow Lines (Background Dynamic Graphics) -->
  <g stroke="url(#accentGradient)" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M-50 280 Q 250 150 550 250 T 1250 100">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="15s" repeatCount="indefinite"/>
    </path>
    <path d="M-50 100 Q 350 300 750 120 T 1250 260">
      <animate attributeName="stroke-dasharray" values="1000,0;0,1000" dur="18s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Foreground Container Card for Text Protection -->
  <rect x="60" y="45" width="1080" height="260" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1.5" backdrop-filter="blur(12px)"/>

  <!-- Top Decorative Accent Bar -->
  <rect x="60" y="45" width="1080" height="5" fill="url(#accentGradient)" rx="2"/>

  <!-- Foreground Title and Subtitle (Guaranteed Clear & Visible) -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <rect x="470" y="75" width="260" height="30" rx="15" fill="rgba(99, 102, 241, 0.2)" stroke="#818cf8" stroke-width="1"/>
    <text x="600" y="95" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">
      SAAS SECURITY &amp; CONNECTIVITY
    </text>

    <!-- Main Repository Title -->
    <text x="600" y="155" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      Awesome SaaS Security &amp; Connectivity
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Curated Ecosystem for SSPM, Identity Governance, Authorization &amp; Open-Source Automation
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(240, 235)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="190" height="34" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="95" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
        🛡️ Enterprise SSPM
      </text>

      <!-- Pill 2 -->
      <rect x="210" y="0" width="220" height="34" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="320" y="22" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
        🔑 Identity &amp; Authorization
      </text>

      <!-- Pill 3 -->
      <rect x="450" y="0" width="250" height="34" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="575" y="22" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
        ⚡ Open-Source Integration
      </text>
    </g>
  </g>
</svg>
